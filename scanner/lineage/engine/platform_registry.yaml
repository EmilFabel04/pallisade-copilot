# Platform Registry — Single Source of Truth (YAML)
#
# Every platform/tool known to the lineage engine is registered here.
# To add a new platform, add ONE entry under `platforms:`.
#
# Fields (all optional except category and domain):
#   category:        warehouse | ingestion | transformation | orchestration | reporting | infrastructure | version_control | quality
#   domain:          warehouse | transform | orchestration | bi | ingestion | catalog | app | other
#   capabilities:    list of additional ToolCategory values (eligibility hints, not proof)
#   is_warehouse:    true if this is a data warehouse (default: false)
#   is_sql_engine:   true if it executes SQL (default: false)
#   adapter_id:      name of the adapter module (default: null)
#   heuristic_order: extraction ordering, lower = higher priority (default: 50)
#   aliases:         list of alternative names (default: [])

platforms:

  # ── Warehouses ──────────────────────────────────────────────────────────
  bigquery:
    category: warehouse
    domain: warehouse
    is_warehouse: true
    is_sql_engine: true
    adapter_id: live_warehouse
    heuristic_order: 10

  snowflake:
    category: warehouse
    domain: warehouse
    capabilities: [transformation]
    is_warehouse: true
    is_sql_engine: true
    adapter_id: live_warehouse
